name: CI

# Скрипт запускается при каждом пуше в ветку main/master или при пулл-реквестах
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest # Запускаем на чистой Linux-машине

    steps:
    # 1. Скачиваем код репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Устанавливаем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-with-version: '3.14.5' # Укажите вашу версию Python (например, 3.12 или 3.13)
        cache: 'pip'

    # 3. Устанавливаем зависимости
    # Укажите библиотеки для тестов. Если есть requirements.txt, используйте pip install -r requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  

    # 4. Проверяем стиль кода с помощью Black (--check не меняет файлы, а только проверяет)
    - name: Check code formatting with Black
      run: |
        black --check bot/ tests/

    # 5. Проверяем код на ошибки и опечатки с помощью Ruff
    - name: Lint code with Ruff
      run: |
        ruff check bot/ tests/

    # 6. Если код чистый, запускаем юнит-тесты
    - name: Run tests with pytest
      run: |
        pytest


